[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pepe"
version = "0.0.1"
description = "Pepe — persistent agentic private-equity associate (Phase 0 architecture bootstrap)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pepe" }]
keywords = ["private-equity", "agent", "lbo", "excel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "numpy-financial>=0.1",
    "von-sdk>=1.3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
excel = ["openpyxl>=3.1"]
msg = ["python-telegram-bot>=21"]
local = ["ollama>=0.3"]
gateway = ["litellm>=1.50", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Router device backends. `von-sdk` is always installed (Von is the default
# intent router); these extras select the inference device.
router-cpu = ["openvino>=2024.0"]
router-gpu = []

[tool.hatch.build.targets.wheel]
packages = ["src/pepe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
